<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | KwangWickWebGL</title>
    </head>

  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width="960" height="600" style="width: 100%; height: 100%; background: #231F20"></canvas>
    <script src="Build/KwangWickWebGL.loader.js"></script>
    <script>
      // Unity 인스턴스 생성만 담당
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/KwangWickWebGL.data",
        frameworkUrl: "Build/KwangWickWebGL.framework.js",
        codeUrl: "Build/KwangWickWebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "KwangWickWebGL",
        productVersion: "0.1",
      });
    </script>
  </body>
</html>
